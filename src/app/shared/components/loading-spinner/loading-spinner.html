<div [class]="overlay ? 'fixed inset-0 bg-black bg-opacity-30 dark:bg-opacity-50 flex items-center justify-center z-50' : 'flex items-center justify-center min-h-[70vh] w-full'">
  <div class="flex flex-col items-center gap-3">
    <div
      class="animate-spin rounded-full border-solid border-t-transparent"
      [ngClass]="{
        'w-8 h-8 border-4 border-blue-500': size === 'sm',
        'w-12 h-12 border-4 border-blue-500': size === 'md',
        'w-16 h-16 border-6 border-blue-500': size === 'lg'
      }">
    </div>
    @if (message) {
      <p class="text-gray-700 dark:text-gray-300 text-sm font-medium">{{ message }}</p>
    }
  </div>
</div>
