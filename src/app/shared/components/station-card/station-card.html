<div
  class="h-full bg-white dark:bg-gray-800 rounded p-4 light:shadow-lg flex flex-col gap-2 relative">
  @if (this.showStats) {
    <h3 class="text-lg font-semibold mb-1 flex items-center justify-between gap-2">
      <span>{{ station.name }}</span>
      <button
        (click)="navigateToDetail()"
        class="p-1 rounded hover:bg-gray-200 dark:hover:bg-gray-700 transition-colors">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 text-gray-600 dark:text-gray-300" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
        </svg>
      </button>
    </h3>
  }
  <div class="w-full" [ngClass]="{'h-80 md:h-96 lg:h-[500px] xl:h-[450px]': !showStats}">
    <canvas baseChart
            id="chart"
            [data]="chartData"
            [options]="chartOptions"
            [type]="chartType">
    </canvas>
  </div>
  @if (this.showStats) {
    <span class="flex justify-between items-center font-bold">
    <span>{{ (measurements[0]?.temperature) | number:'1.1-2' }} °C</span>
    <span>{{ measurements[0]?.humidity | number:'1.1-2' }} %</span>
    <span>{{ measurements[0]?.absoluteHumidity | number:'1.1-2' }} <sup>g</sup>/<sub>kg</sub></span>
  </span>
  }
</div>
