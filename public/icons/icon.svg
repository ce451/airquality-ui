<!-- Vector source for the PWA icons (public/icons/icon-*.png and favicon.ico
     are derived from this design). Cloud glyph matches the in-app header logo;
     the shape stays inside the maskable safe zone (central 80%). -->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#DB18D6"/>
      <stop offset="1" stop-color="#40ECC5"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#g)"/>
  <g fill="#fff">
    <circle cx="190" cy="305" r="60"/>
    <circle cx="285" cy="255" r="95"/>
    <circle cx="355" cy="310" r="58"/>
    <rect x="130" y="295" width="285" height="80" rx="40"/>
  </g>
</svg>
