@if (isLoading) {
  <app-loading-spinner size="lg" message="Loading station details..."></app-loading-spinner>
} @else {
  <div class="rounded bg-white dark:bg-gray-800 p-4 shadow-lg text-lg">
    <h1 class="text-2xl">Station <span class="font-bold">{{ station.name }}</span></h1>
    <span class="">Details</span>

    <div class="flex flex-row gap-2 md:gap-4 lg:gap-6 md:my-4 lg:my-6 flex-wrap md:grow-1 whitespace-nowrap ">
      <div
        class="flex flex-col flex-1 sm:grow-0 items-center md:items-start rounded bg-gray-100 dark:bg-gray-700 py-3 px-8">
        <span>Id</span>
        <span class="font-semibold">{{ station.id }}</span>
      </div>
      <div
        class="flex flex-col flex-1 sm:grow-0 items-center md:items-start rounded bg-gray-100 dark:bg-gray-700 py-3 px-8">
        <span>Name</span>
        <span class="font-semibold">{{ station.name }}</span>
      </div>
      <div
        class="flex flex-col flex-1 sm:grow-0 items-center md:items-start rounded bg-gray-100 dark:bg-gray-700 py-3 px-8">
        <span>Status</span>
        <span class="font-semibold">{{ station.status }}</span>
      </div>
      <div
        class="flex flex-col flex-1 sm:grow-0 items-center md:items-start rounded bg-gray-100 dark:bg-gray-700 py-3 px-8">
        <span>IP Address</span>
        <span class="font-semibold">{{ station.ipAddress }}</span>
      </div>
      <div
        class="flex flex-col flex-1 sm:grow-0 items-center md:items-start rounded bg-gray-100 dark:bg-gray-700 py-3 px-8">
        <span>Last updated</span>
        <span class="font-semibold">{{ station.measurements[0].timestamp | lastUpdated }}</span>
      </div>
    </div>

    <!-- Time Filter Buttons -->
    <div class="flex flex-wrap gap-2 my-4">
      <button
        (click)="setTimeFilter('1h')"
        [class.bg-[var(--color-primary-500)]]="selectedFilter === '1h'"
        [class.text-white]="selectedFilter === '1h'"
        [class.bg-gray-200]="selectedFilter !== '1h'"
        [class.dark:bg-gray-700]="selectedFilter !== '1h'"
        [class.dark:text-gray-300]="selectedFilter !== '1h'"
        class="px-4 py-2 rounded-lg font-semibold hover:opacity-80 transition-opacity">
        1 Hour
      </button>
      <button
        (click)="setTimeFilter('3h')"
        [class.bg-[var(--color-primary-500)]]="selectedFilter === '3h'"
        [class.text-white]="selectedFilter === '3h'"
        [class.bg-gray-200]="selectedFilter !== '3h'"
        [class.dark:bg-gray-700]="selectedFilter !== '3h'"
        [class.dark:text-gray-300]="selectedFilter !== '3h'"
        class="px-4 py-2 rounded-lg font-semibold hover:opacity-80 transition-opacity">
        3 Hours
      </button>
      <button
        (click)="setTimeFilter('24h')"
        [class.bg-[var(--color-primary-500)]]="selectedFilter === '24h'"
        [class.text-white]="selectedFilter === '24h'"
        [class.bg-gray-200]="selectedFilter !== '24h'"
        [class.dark:bg-gray-700]="selectedFilter !== '24h'"
        [class.dark:text-gray-300]="selectedFilter !== '24h'"
        class="px-4 py-2 rounded-lg font-semibold hover:opacity-80 transition-opacity">
        24 Hours
      </button>
      <button
        (click)="setTimeFilter('week')"
        [class.bg-[var(--color-primary-500)]]="selectedFilter === 'week'"
        [class.text-white]="selectedFilter === 'week'"
        [class.bg-gray-200]="selectedFilter !== 'week'"
        [class.dark:bg-gray-700]="selectedFilter !== 'week'"
        [class.dark:text-gray-300]="selectedFilter !== 'week'"
        class="px-4 py-2 rounded-lg font-semibold hover:opacity-80 transition-opacity">
        Week
      </button>
      <button
        (click)="setTimeFilter('month')"
        [class.bg-[var(--color-primary-500)]]="selectedFilter === 'month'"
        [class.text-white]="selectedFilter === 'month'"
        [class.bg-gray-200]="selectedFilter !== 'month'"
        [class.dark:bg-gray-700]="selectedFilter !== 'month'"
        [class.dark:text-gray-300]="selectedFilter !== 'month'"
        class="px-4 py-2 rounded-lg font-semibold hover:opacity-80 transition-opacity">
        Month
      </button>
    </div>

    <div class="-mx-3 relative">
      <!-- Chart loading overlay -->
      @if (isLoadingChart) {
        <div class="absolute inset-0 bg-white/70 dark:bg-gray-800/70 backdrop-blur-[1px] rounded flex items-center justify-center z-10">
          <div class="flex flex-col items-center gap-2">
            <div class="w-12 h-12 border-4 border-blue-200 border-t-blue-500 rounded-full animate-spin"></div>
            <span class="text-sm text-gray-600 dark:text-gray-300">Loading chart data...</span>
          </div>
        </div>
      }
      <app-station-card [station]="station" [showStats]="false"></app-station-card>
    </div>
  </div>
}
