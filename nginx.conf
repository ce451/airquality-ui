map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_name localhost;

  root /usr/share/nginx/html;
  index index.html index.htm;

  # Compress on the fly: measurement JSON is highly repetitive (~5x smaller)
  # and the JS bundles shrink ~4x. The base image ships with gzip disabled, so
  # without this every byte crosses the (possibly relayed) Tailscale link raw.
  # gzip_proxied any covers /api responses; bodies the API already compressed
  # itself pass through untouched. text/html is always included implicitly.
  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_vary on;
  gzip_types application/json application/problem+json application/javascript text/css image/svg+xml application/manifest+json text/plain;

  # Docker's embedded DNS, re-resolved at request time so nginx starts and
  # keeps working when the API container is down or gets a new IP.
  resolver 127.0.0.11 valid=10s ipv6=off;

  # Same-origin API: /api/* -> Spring backend (prefix stripped).
  # Upgrade headers + buffering off cover the STOMP WebSocket and the SockJS
  # streaming fallbacks; STOMP heartbeats (10 s) keep the connection well
  # inside the read timeout.
  location /api/ {
    set $api_upstream airquality_api:8080;
    rewrite ^/api(/.*)$ $1 break;
    proxy_pass http://$api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 90s;
  }

  # The service-worker update chain must always revalidate these.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }
  location = /ngsw.json {
    add_header Cache-Control "no-cache";
  }
  location = /ngsw-worker.js {
    add_header Cache-Control "no-cache";
  }

  # Build artifacts are content-hashed and can be cached forever.
  location ~ \.(js|css)$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
